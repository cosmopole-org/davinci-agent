name: Crypto Predictions E2E Test

on:
  workflow_dispatch:
    inputs:
      agentrouter_api_key:
        description: "AgentRouter API key (overrides secret)"
        required: false
        default: ""
  push:
    branches:
      - claude/agentrouter-adapter-crypto-tests-dy84dt

jobs:
  crypto-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      LLM_PROVIDER: agentrouter
      AGENTROUTER_API_KEY: ${{ inputs.agentrouter_api_key || secrets.AGENTROUTER_API_KEY }}
      CASPAR_DOCKER_RUNTIME: runc
      CASPAR_DOCKER_DISK_QUOTA: "0"
      DATA_ROOT: /tmp/caspar
    steps:
      # ── Repos ────────────────────────────────────────────────────────────────
      - name: Check out davinci-agent
        uses: actions/checkout@v4
        with:
          path: davinci-agent

      - name: Check out caspar
        uses: actions/checkout@v4
        with:
          repository: cosmopole-org/caspar
          path: caspar

      # ── Toolchains ───────────────────────────────────────────────────────────
      - name: Set up Java 17 (required by QuestDB)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          cd davinci-agent
          pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true
          # Ensure runtime deps are present:
          #   anthropic   — AgentRouterClient transport
          #   requests    — HTTP for LLM/tool calls
          #   pycryptodome — RSA-PSS signing of Caspar signaling packets
          #                  (davinci/caspar_signaling.py imports Crypto.*)
          pip install anthropic requests pycryptodome

      # ── Docker daemon — register runsc alias ─────────────────────────────────
      # The pre-built dist/bin/caspar-node has the runsc runtime hardcoded in
      # its Docker creature launch path (the env-gating fix lives in source but
      # the dist binary predates it). Registering "runsc" as an alias that calls
      # the stock runc binary is the same workaround used in local testing and
      # avoids needing a full Cargo rebuild in CI.  storage_opt "size" is also
      # problematic on non-XFS-pquota filesystems, so we disable it via the
      # CASPAR_DOCKER_DISK_QUOTA=0 env var already set at the job level (the
      # old binary reads that var if it was compiled with the env-gating patch;
      # for truly old binaries the quota just gets silently ignored by Docker on
      # overlayfs, which is acceptable for CI).
      - name: Register runsc → runc alias in Docker daemon
        run: |
          RUNC=$(command -v runc || echo /usr/bin/runc)
          sudo tee /etc/docker/daemon.json > /dev/null <<EOF
          {
            "runtimes": {
              "runsc": { "path": "$RUNC" }
            }
          }
          EOF
          sudo systemctl restart docker
          # Confirm runsc is now known to Docker
          docker info --format '{{json .Runtimes}}' | grep -q runsc \
            && echo "runsc runtime registered OK" \
            || echo "::warning::runsc not listed in docker info — tool containers may fail"
            
      # ── Docker bridge used by Caspar creature containers ───────────────────────
      # Caspar's docker-host gateway authenticates a creature from the source IP
      # of its TCP connection. The creature must therefore dial the host-side
      # gateway through the *same* Docker bridge it is attached to (`kasper`), not
      # through Docker's default host-gateway address. Resolve that bridge gateway
      # dynamically instead of assuming 172.18.0.1; hosted runners can have
      # pre-existing Docker networks that shift the chosen subnet and make the
      # hard-coded address a black hole, which surfaces as Phase 2 serve timeouts.
      - name: Prepare kasper network gateway env
        run: |
          set -euo pipefail
          if ! docker network inspect kasper >/dev/null 2>&1; then
            docker network create kasper >/dev/null
          fi
          GATEWAY=$(docker network inspect kasper --format '{{(index .IPAM.Config 0).Gateway}}')
          if [ -z "$GATEWAY" ] || [ "$GATEWAY" = "<no value>" ]; then
            echo "::error::could not resolve kasper bridge gateway"
            docker network inspect kasper || true
            exit 1
          fi
          echo "DOCKER_HOST_GATEWAY_ADVERTISE_HOST=$GATEWAY" >> "$GITHUB_ENV"
          echo "CASPAR_NODE_HOST_FROM_VM=$GATEWAY" >> "$GITHUB_ENV"
          echo "Using kasper gateway $GATEWAY for creature -> host traffic"

      # ── Caspar node ──────────────────────────────────────────────────────────
      # run-nodes.sh owns the full node bring-up: it creates the `kasper` Docker
      # bridge network, starts a per-node QuestDB, generates node config + babble
      # keys + peers.genesis.json, launches the node, and blocks until the
      # signaling port (8074) accepts connections before returning. We drive it
      # with the appropriate flags for CI:
      #   single          — only node1 (no triple-node consensus cluster)
      #   --no-docker     — run the node as the pre-built dist binary on the host
      #                     (the node still launches docker tool creatures itself)
      #   --no-gvisor     — no runsc sandbox in CI; this auto-exports
      #                     CASPAR_DOCKER_RUNTIME=runc + CASPAR_DOCKER_DISK_QUOTA=0
      #   --no-firecracker— no microVM host networking in CI
      #   --no-rebuild    — use dist/ binaries as-is (no cargo build)
      #   --skip-deploy   — the crypto test deploys its own creatures via the
      #                     signaling API, so skip the WASM clone/build step
      - name: Start Caspar node via run-nodes.sh
        working-directory: caspar
        run: |
          chmod +x ./run-nodes.sh ./stop-nodes.sh 2>/dev/null || true
          ./run-nodes.sh single \
            --no-docker \
            --no-gvisor \
            --no-firecracker \
            --no-rebuild \
            --skip-deploy

      - name: Verify creature gateway route
        run: |
          set -euo pipefail
          CURRENT_GATEWAY=$(docker network inspect kasper --format '{{(index .IPAM.Config 0).Gateway}}')
          if [ "$CURRENT_GATEWAY" != "$DOCKER_HOST_GATEWAY_ADVERTISE_HOST" ]; then
            echo "::error::kasper gateway changed after node start: prepared=$DOCKER_HOST_GATEWAY_ADVERTISE_HOST current=$CURRENT_GATEWAY"
            docker network inspect kasper || true
            exit 1
          fi
          docker run --rm -i --network kasper public.ecr.aws/docker/library/python:3.12-slim \
            python - "$DOCKER_HOST_GATEWAY_ADVERTISE_HOST" <<'PY'
          import socket
          import sys

          host = sys.argv[1]
          for port in (8074, 8079):
              sock = socket.socket()
              sock.settimeout(5)
              try:
                  sock.connect((host, port))
              finally:
                  sock.close()
          print(f"kasper route to {host}:8074 and {host}:8079 is reachable")
          PY

      # ── Run the test ─────────────────────────────────────────────────────────
      - name: Run crypto predictions test
        id: crypto_test
        continue-on-error: true
        run: |
          cd davinci-agent
          set -o pipefail
          python3 scripts/crypto_predictions_test.py 2>&1 | tee /tmp/crypto_test.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # ── Collect and print all logs ────────────────────────────────────────────
      - name: Print Caspar node log
        if: always()
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "  CASPAR NODE LOG  ($DATA_ROOT/node1/node.log)"
          echo "════════════════════════════════════════════════════════════"
          cat "$DATA_ROOT/node1/node.log" 2>/dev/null || echo "(no node log found)"

      - name: Print QuestDB log
        if: always()
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "  QUESTDB LOG  ($DATA_ROOT/node1/questdb.log)"
          echo "════════════════════════════════════════════════════════════"
          cat "$DATA_ROOT/node1/questdb.log" 2>/dev/null || echo "(no questdb log)"

      - name: Print Docker container logs
        if: always()
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "  DOCKER CONTAINERS"
          echo "════════════════════════════════════════════════════════════"
          docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Image}}" || true
          echo ""

          # Print logs for every container (tool VMs follow *_global_* naming)
          for cid in $(docker ps -aq 2>/dev/null); do
            name=$(docker inspect --format '{{.Name}}' "$cid" 2>/dev/null | tr -d '/')
            echo "────────────────────────────────────────────────────────"
            echo "  Container: $name  ($cid)"
            echo "────────────────────────────────────────────────────────"
            docker logs --timestamps "$cid" 2>&1 || true
            echo ""
          done

      - name: Print crypto test output
        if: always()
        run: |
          echo "════════════════════════════════════════════════════════════"
          echo "  CRYPTO TEST STDOUT/STDERR  (/tmp/crypto_test.log)"
          echo "════════════════════════════════════════════════════════════"
          cat /tmp/crypto_test.log 2>/dev/null || echo "(no test log)"

      # ── Upload logs as artifact ───────────────────────────────────────────────
      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-e2e-logs-${{ github.run_id }}
          retention-days: 7
          path: |
            /tmp/crypto_test.log
            /tmp/caspar/node1/node.log
            /tmp/caspar/node1/questdb.log

      # ── Final status ─────────────────────────────────────────────────────────
      - name: Report result
        if: always()
        run: |
          echo "════════════════════════════════════════════════════════════"
          if grep -q "OVERALL.*PASS" /tmp/crypto_test.log 2>/dev/null; then
            echo "  RESULT: PASS"
          elif grep -q "OVERALL.*FAIL" /tmp/crypto_test.log 2>/dev/null; then
            echo "  RESULT: FAIL"
            exit 1
          else
            echo "  RESULT: UNKNOWN (check logs above)"
            exit 1
          fi
          echo "════════════════════════════════════════════════════════════"
